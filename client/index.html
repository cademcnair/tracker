<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracker</title>
    <style>
      * { touch-action: manipulation !important; }
      @media screen and (max-width: 600px) {
        button {
          color: black !important;
          border-radius: .5rem !important;
        }
        select {
          color: black !important;
        }
      }
      html, body {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>setInterval(()=>window.dispatchEvent(new Event('resize')), 100)</script>
    <script>

      window.alarm = new Audio("/alarm.mp3")
      window.alarm.loop = true
      let have_audio = false
      let intv = setInterval(()=>{
        if (have_audio) return;
        document.addEventListener("click", unlock)
        document.addEventListener("touchstart", unlock)
        document.addEventListener("keydown", unlock)
      }, 100)
      function unlock() {
        if (have_audio) return;
        window.alarm.play().finally(_ => window.alarm.pause())
        document.removeEventListener("click", unlock)
        document.removeEventListener("touchstart", unlock)
        document.removeEventListener("keydown", unlock)
        document.addEventListener("click", () => window.alarm.pause())
        document.addEventListener("touchstart", () => window.alarm.pause())
        document.addEventListener("keydown", () => window.alarm.pause())
        have_audio = true; clearInterval(intv)
      }

      if ('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play', () => {});
        navigator.mediaSession.setActionHandler('pause', () => {});
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
